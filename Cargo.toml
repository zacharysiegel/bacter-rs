[workspace]
resolver = "3"
members = [
    "shared",
    "server",
    "web",
    "tools/protocol_dump",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
shared = { path = "shared" }

# simulation and protocol
bitcode = "0.6.*"
libm = "0.2.*"
minimer = "2.2.*"
log = "0.4.*"

# renderer
wgpu = { version = "30.0.*", default-features = false }
raw-window-handle = "0.6.*"
bytemuck = { version = "1.25.*", features = ["derive"] }
web-sys = "0.3.*"

# game server
actix-web = "4.13.*"
rustls = "0.23.*"
actix-ws = "0.4.*"
actix-files = "0.7.*"
tokio = { version = "1.52.*", default-features = false }
futures-util = "0.3.*"
bytes = "1.11.*"
dashmap = "6.1.*"
bcrypt = "0.17.*"
getrandom = "0.4.*"
env_logger = "0.11.*"
dotenvy = "0.15.*"
tokio-tungstenite = "0.26.*"

# tools
clap = "4.6.*"

# web client
leptos = "0.8.*"
leptos_meta = "0.8.*"
leptos_axum = "0.8.*"
axum = "0.8.*"
any_spawner = { version = "0.3.*", features = ["tokio"] }
wasm-bindgen = "0.2.*"
wasm-bindgen-futures = "0.4.*"
js-sys = "0.3.*"
console_log = "0.2.*"
console_error_panic_hook = "0.1.*"
wasm-bindgen-test = "0.3.*"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
