[package]
name = "web"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shared = { workspace = true, features = ["render"] }
leptos = { workspace = true }
leptos_meta = { workspace = true }
log = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Window",
    "Document",
    "Location",
    "Storage",
    "Performance",
    "HtmlCanvasElement",
    "HtmlElement",
    "Element",
    "DomRect",
    "EventTarget",
    "Event",
    "KeyboardEvent",
    "MouseEvent",
    "FocusEvent",
    "WebSocket",
    "BinaryType",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "Response",
    "RequestInit",
] }
console_log = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
any_spawner = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# Other targets are not downloaded, so they keep debug and trace records in release builds.
[target.'cfg(target_arch = "wasm32")'.dependencies]
log = { workspace = true, features = ["release_max_level_info"] }

# Other targets have no browser to run #[wasm_bindgen_test] cases in.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:console_log",
    "dep:console_error_panic_hook",
]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:any_spawner",
    "tokio/rt",
    "tokio/rt-multi-thread",
    "tokio/net",
    "tokio/macros",
]

[package.metadata.leptos]
output-name = "bacter"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "static"
site-addr = "127.0.0.1:3011"
reload-port = 3012
browserquery = "defaults"
bin-features = ["ssr"]
lib-features = ["hydrate"]
bin-default-features = false
lib-default-features = false
lib-profile-release = "wasm-release"
